<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Place Order</title>

    <link
        rel="stylesheet"
        href="third.css"
    >

</head>


<body>


<div class="box">


    <h2>
        🛒 Place Your Order
    </h2>


    <h4>
        Your Selected Items
    </h4>


    <!-- Cart Items -->

    <div id="cartItems"></div>


    <!-- Empty Cart -->

    <div
        id="emptyCart"
        class="empty"
    >

        Your cart is empty.

        <br><br>

        <a href="menu.html">
            🍴 Go to Menu
        </a>

    </div>


    <!-- Bill -->

    <div class="bill">

        <p>

            <span>Subtotal</span>

            <span id="subtotal">
                ₹0
            </span>

        </p>


        <p>

            <span>Delivery</span>

            <span id="delivery">
                ₹0
            </span>

        </p>


        <p class="grand">

            <span>Total</span>

            <span id="totalBox">
                ₹0
            </span>

        </p>

    </div>



    <!-- Customer Details -->

    <div class="customer-form">

        <h3>
            👤 Customer Details
        </h3>


        <input
            id="customerName"
            type="text"
            placeholder="Enter Your Name"
        >


        <input
            id="customerPhone"
            type="tel"
            placeholder="Enter 10-digit Phone Number"
            maxlength="10"
        >


        <textarea
            id="customerAddress"
            placeholder="Enter Delivery Address"
        ></textarea>

    </div>



    <!-- Place Order -->

    <button
        onclick="placeOrder()"
        class="place-btn"
    >

        ✅ Place Order

    </button>



    <!-- Back -->

    <button
        class="back-btn"
        onclick="goBack()"
    >

        ← Back

    </button>



    <!-- Continue Shopping -->

    <a
        class="menu-link"
        href="menu.html"
    >

        🍕 Continue Shopping

    </a>


</div>



<script src="script.js"></script>

<script>

    renderCart();

</script>


</body>

</html>
