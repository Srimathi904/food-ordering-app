<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Food Menu</title>

    <link rel="stylesheet" href="second.css">

</head>


<body>


<h1 class="title">
    🍴 Our Menu
</h1>


<!-- Search and Filter -->

<div class="menu-tools">

    <input
        type="text"
        id="searchFood"
        placeholder="🔍 Search food..."
        onkeyup="filterFood()"
    >


    <select
        id="categoryFilter"
        onchange="filterFood()"
    >

        <option value="all">
            All Categories
        </option>

        <option value="main">
            Main Food
        </option>

        <option value="snack">
            Snacks
        </option>

        <option value="dessert">
            Dessert
        </option>

        <option value="drink">
            Drinks
        </option>

    </select>

</div>



<!-- Food Menu -->

<div class="menu-container">


    <!-- Burger -->

    <div
        class="card"
        data-name="burger"
        data-category="main"
    >

        <img src="burgernew.jpeg"
             alt="Burger">

        <h3>Burger</h3>

        <p>₹120</p>

        <button
            onclick="addToCart('Burger',120)"
        >
            Add to Cart 🛒
        </button>

    </div>



    <!-- Pizza -->

    <div
        class="card"
        data-name="pizza"
        data-category="main"
    >

        <img src="pizzanew.jpeg"
             alt="Pizza">

        <h3>Pizza</h3>

        <p>₹250</p>

        <button
            onclick="addToCart('Pizza',250)"
        >
            Add to Cart 🛒
        </button>

    </div>



    <!-- Fries -->

    <div
        class="card"
        data-name="french fries fries"
        data-category="snack"
    >

        <img src="friesnew.jpeg"
             alt="French Fries">

        <h3>French Fries</h3>

        <p>₹90</p>

        <button

        >
            Add to Cart 🛒
        </button>

    </div>



    <!-- Sandwich -->

    <div
        class="card"
        data-name="sandwich"
        data-category="snack"
    >

        <img src="sandwichnew.jpeg"
             alt="Sandwich">

        <h3>Sandwich</h3>

        <p>₹110</p>

        <button
            onclick="addToCart('Sandwich',110)"
        >
            Add to Cart 🛒
        </button>

    </div>



    <!-- Pasta -->

    <div
        class="card"
        data-name="pasta"
        data-category="main"
    >

        <img src="pastanew.jpeg"
             alt="Pasta">

        <h3>Pasta</h3>

        <p>₹180</p>

        <button
            onclick="addToCart('Pasta',180)"
        >
            Add to Cart 🛒
        </button>

    </div>



    <!-- Noodles -->

    <div
        class="card"
        data-name="noodles noodle"
        data-category="main"
    >

        <img src="noodlenew.jpeg"
             alt="Noodles">

        <h3>Noodles</h3>

        <p>₹160</p>

        <button
            onclick="addToCart('Noodles',160)"
        >
            Add to Cart 🛒
        </button>

    </div>



    <!-- Ice Cream -->

    <div
        class="card"
        data-name="ice cream icecream"
        data-category="dessert"
    >

        <img src="iccrmnew.jpeg"
             alt="Ice Cream">

        <h3>Ice Cream</h3>

        <p>₹80</p>

        <button
            onclick="addToCart('Ice Cream',80)"
        >
            Add to Cart 🛒
        </button>

    </div>



    <!-- Juice -->

    <div
        class="card"
        data-name="juice"
        data-category="drink"
    >

        <img src="juicenew.jpeg"
             alt="Juice">

        <h3>Juice</h3>

        <p>₹70</p>

        <button
            onclick="addToCart('Juice',70)"

            Add to Cart 🛒
        </button>

    </div>



    <!-- Coffee -->

    <div
        class="card"
        data-name="coffee"
        data-category="drink"
    >

        <img src="coffenew.jpeg"
             alt="Coffee">

        <h3>Coffee</h3>

        <p>₹60</p>

        <button
            onclick="addToCart('Coffee',60)"
        >
            Add to Cart 🛒
        </button>

    </div>

</div>



<!-- Bottom Buttons -->

<div class="bottom-actions">

    <button
        class="back-btn"
        onclick="goBack()"
    >
        ← Back
    </button>


    <a
        class="order-btn"
        href="placeorder.html"
    >

        Go to Cart / Order 🛒

        <span id="cartCount">
            0
        </span>

    </a>

</div>


<script src="script.js"></script>

</body>

</html>
